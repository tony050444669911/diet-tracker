<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲食記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d1b2a;
  --surface: #1b2d45;
  --surface2: #243b55;
  --border: #2d4a6e;
  --accent: #48cae4;
  --accent2: #f9c74f;
  --accent3: #90e0ef;
  --text: #e0f4ff;
  --muted: #7ba3c4;
  --danger: #ef476f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
}
body {
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}
.mono { font-family: 'DM Mono', monospace; }
#sidebar {
  background: var(--surface);
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}
#tabrow {
  display: flex;
  background: rgba(13,27,42,0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  z-index: 50;
}
.tab-btn {
  flex: 1;
  padding: 10px 4px 12px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.tab-btn.active { color: var(--accent); }
.tab-btn svg { width: 22px; height: 22px; }
.tab-panel { display: none; padding: 0 0 80px; }
.tab-panel.active { display: block; }
.ring-container { position: relative; display: inline-block; }
.ring-container .ring-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}
.macro-bar-bg {
  background: var(--surface2);
  border-radius: 99px;
  height: 8px;
  overflow: hidden;
  flex: 1;
}
.macro-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.4s ease;
}
.food-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 8px 16px;
}
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 430px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px 16px 32px;
  animation: slideUp 0.25s ease;
}
.modal-center {
  border-radius: 16px;
  margin: auto;
  max-height: 80vh;
  max-width: 380px;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.form-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--accent); }
.form-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
  display: block;
}
#autocomplete-list {
  position: absolute;
  left: 0; right: 0; top: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  z-index: 200;
  max-height: 200px;
  overflow-y: auto;
  display: none;
  margin-top: 2px;
}
#autocomplete-list.open { display: block; }
.autocomplete-item {
  padding: 9px 12px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.autocomplete-item:hover, .autocomplete-item.selected { background: var(--border); }
#toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: calc(100% - 32px);
  max-width: 400px;
}
.toast {
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  animation: toastIn 0.3s ease;
  text-align: center;
}
.toast.success { background: #1a4a2e; border: 1px solid #2d7a4a; color: #6ee7a0; }
.toast.error { background: #4a1a1a; border: 1px solid #7a2d2d; color: #ef476f; }
.toast.info { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
@keyframes toastIn {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.date-nav-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
}
#meal-bar {
  display: none;
  position: fixed;
  bottom: 68px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 398px;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 10px 14px;
  z-index: 40;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#meal-bar.visible { display: flex; }
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  padding: 16px 16px 6px;
}
.btn {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 500;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.75; }
.btn-accent { background: var(--accent); color: #0d1b2a; }
.btn-surface { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
#loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,27,42,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}
#loading-overlay.visible { display: flex; }
@keyframes tailWag {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(22deg); }
  75% { transform: rotate(-22deg); }
}
.tail-wag {
  transform-origin: 64px 65px;
  animation: tailWag 0.55s ease-in-out infinite;
}
.chart-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 8px 16px;
  padding: 14px;
}
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 99px;
  background: var(--danger);
  color: #fff;
  margin-left: 6px;
}
.expand-section {
  display: none;
  padding: 12px;
  background: var(--surface2);
  border-radius: 10px;
  margin-top: 8px;
}
.expand-section.open { display: block; }
.template-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
@media (min-width: 768px) {
  html { background: #080e18; }
  body {
    max-width: 860px;
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: auto 1fr;
  }
  #sidebar {
    grid-column: 1;
    grid-row: 1 / 3;
    border-right: 1px solid var(--border);
    border-bottom: none;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  #tabrow {
    grid-column: 2;
    grid-row: 1;
    position: sticky;
    top: 0;
    background: rgba(13,27,42,0.95);
    backdrop-filter: blur(12px);
    z-index: 10;
    left: auto;
    transform: none;
    max-width: none;
    width: auto;
    bottom: auto;
    border-top: none;
    border-bottom: 1px solid var(--border);
  }
  #main-content { grid-column: 2; grid-row: 2; overflow-y: auto; }
  .tab-panel { padding-bottom: 20px; }
  #meal-bar { left: calc(50% + 160px); transform: translateX(-50%); max-width: 460px; bottom: 20px; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <!-- Header Cat (44x44) -->
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="26" r="14" fill="#1b3a5c"/>
        <polygon points="10,18 14,7 18,18" fill="#243b55" stroke="#48cae4" stroke-width="1.5"/>
        <polygon points="26,18 30,7 34,18" fill="#243b55" stroke="#48cae4" stroke-width="1.5"/>
        <circle cx="17" cy="24" r="2.5" fill="#48cae4"/>
        <circle cx="27" cy="24" r="2.5" fill="#48cae4"/>
        <circle cx="17.8" cy="23.2" r="1" fill="#0d1b2a"/>
        <circle cx="27.8" cy="23.2" r="1" fill="#0d1b2a"/>
        <ellipse cx="22" cy="29" rx="2.5" ry="1.5" fill="#90e0ef"/>
        <line x1="10" y1="27" x2="16" y2="28" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
        <line x1="10" y1="29" x2="16" y2="29" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
        <line x1="28" y1="28" x2="34" y2="27" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
        <line x1="28" y1="29" x2="34" y2="29" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--accent);">飲食記帳本</div>
        <div id="today-date-display" style="font-size:12px;color:var(--muted);"></div>
      </div>
    </div>
    <button id="open-add-food" style="width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;" title="新增食物">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><line x1="10" y1="4" x2="10" y2="16" stroke="#0d1b2a" stroke-width="2.5" stroke-linecap="round"/><line x1="4" y1="10" x2="16" y2="10" stroke="#0d1b2a" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Calorie ring + summary -->
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
    <div class="ring-container">
      <svg id="cal-ring" width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle id="cal-ring-fill" cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="10"
          stroke-dasharray="263.9" stroke-dashoffset="263.9"
          stroke-linecap="round" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset 0.5s,stroke 0.3s;"/>
      </svg>
      <div class="ring-label">
        <div id="cal-pct" class="mono" style="font-size:13px;font-weight:700;color:var(--accent);">0%</div>
      </div>
    </div>
    <div style="flex:1;">
      <div id="cal-display" class="mono" style="font-size:3rem;font-weight:700;line-height:1;color:var(--text);">0</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px;">kcal 今日</div>
      <div id="cal-remain" style="font-size:13px;font-weight:600;color:var(--accent);margin-top:4px;"></div>
      <div id="spending-display" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>
    </div>
  </div>

  <!-- Macro bars -->
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
        <span style="font-size:12px;color:var(--accent3);">蛋白質</span>
        <div style="display:flex;align-items:center;">
          <span id="protein-text" class="mono" style="font-size:12px;">0g / 0g</span>
          <span id="protein-badge" class="badge" style="display:none;">超標</span>
        </div>
      </div>
      <div class="macro-bar-bg"><div id="protein-bar" class="macro-bar-fill" style="background:var(--accent3);width:0%;"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
        <span style="font-size:12px;color:var(--accent2);">碳水</span>
        <div style="display:flex;align-items:center;">
          <span id="carbs-text" class="mono" style="font-size:12px;">0g / 0g</span>
          <span id="carbs-badge" class="badge" style="display:none;">超標</span>
        </div>
      </div>
      <div class="macro-bar-bg"><div id="carbs-bar" class="macro-bar-fill" style="background:var(--accent2);width:0%;"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
        <span style="font-size:12px;color:#ff8a80;">油脂</span>
        <div style="display:flex;align-items:center;">
          <span id="fat-text" class="mono" style="font-size:12px;">0g / 0g</span>
          <span id="fat-badge" class="badge" style="display:none;">超標</span>
        </div>
      </div>
      <div class="macro-bar-bg"><div id="fat-bar" class="macro-bar-fill" style="background:#ff8a80;width:0%;"></div></div>
    </div>
  </div>

  <!-- Sheet status -->
  <div id="sheet-status" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:8px 10px;background:var(--surface2);border-radius:8px;">
    <svg width="8" height="8"><circle id="sheet-dot" cx="4" cy="4" r="4" fill="var(--muted)"/></svg>
    <span id="sheet-status-text">尚未連接，請前往設定</span>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">

<!-- TAB ROW -->
<div id="tabrow">
  <button class="tab-btn active" data-tab="daily" onclick="switchTab('daily')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    日常
  </button>
  <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    分析
  </button>
  <button class="tab-btn" data-tab="library" onclick="switchTab('library')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    食物庫
  </button>
  <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    設定
  </button>
</div>

<!-- DAILY TAB -->
<div id="tab-daily" class="tab-panel active">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;">
    <button class="date-nav-btn" id="prev-day">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="11 4 6 9 11 14"/></svg>
    </button>
    <div style="position:relative;">
      <button id="date-center-btn" style="background:none;border:none;cursor:pointer;color:var(--text);font-size:15px;font-weight:600;">
        <span id="nav-date-display"></span>
      </button>
      <input type="date" id="hidden-date-input" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;" onchange="selectDate(this.value)">
    </div>
    <button class="date-nav-btn" id="next-day">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="7 4 12 9 7 14"/></svg>
    </button>
  </div>
  <div id="entries-list"></div>
  <!-- Empty state with sleeping cat (120x90) -->
  <div id="empty-state" style="display:none;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px 32px;">
    <svg width="120" height="90" viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="66" rx="42" ry="18" fill="#1b2d45"/>
      <ellipse cx="60" cy="64" rx="38" ry="16" fill="#243b55"/>
      <ellipse cx="95" cy="70" rx="20" ry="9" fill="#1b2d45"/>
      <ellipse cx="28" cy="70" rx="14" ry="8" fill="#1b2d45"/>
      <ellipse cx="60" cy="58" rx="24" ry="18" fill="#1b2d45"/>
      <ellipse cx="60" cy="56" rx="22" ry="16" fill="#243b55"/>
      <polygon points="45,45 49,33 54,45" fill="#1b2d45" stroke="#48cae4" stroke-width="1.2"/>
      <polygon points="66,45 71,33 75,45" fill="#1b2d45" stroke="#48cae4" stroke-width="1.2"/>
      <ellipse cx="51" cy="54" rx="4" ry="1.5" fill="#2d4a6e"/>
      <ellipse cx="69" cy="54" rx="4" ry="1.5" fill="#2d4a6e"/>
      <path d="M53 59 Q60 65 67 59" stroke="#48cae4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <line x1="40" y1="56" x2="49" y2="58" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
      <line x1="40" y1="59" x2="49" y2="60" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
      <line x1="71" y1="58" x2="80" y2="56" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
      <line x1="71" y1="60" x2="80" y2="59" stroke="#7ba3c4" stroke-width="1" stroke-linecap="round"/>
      <path d="M88 66 Q100 57 106 64 Q112 71 104 74" stroke="#48cae4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="94" y="30" font-size="12" fill="#90e0ef" font-family="DM Mono,monospace">z</text>
      <text x="103" y="19" font-size="9" fill="#7ba3c4" font-family="DM Mono,monospace">z</text>
    </svg>
    <div style="color:var(--muted);font-size:14px;margin-top:14px;">今天還沒有紀錄</div>
    <button onclick="document.getElementById('open-add-food').click()" style="margin-top:12px;background:var(--accent);color:#0d1b2a;border:none;border-radius:10px;padding:8px 22px;font-size:14px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:600;">新增第一筆</button>
  </div>
</div>

<!-- ANALYSIS TAB -->
<div id="tab-analysis" class="tab-panel">
  <div class="section-label">本週熱量</div>

// ============================================================
// UTILS

function todayStr() {
  return new Date().toISOString().slice(0,10);
}
function localDateStr(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function genId() {
  return Date.now() + Math.random().toString(36).slice(2);
}
function fmtDate(str) {
  const [,m,d] = str.split('-');
  return `${m}/${d}`;
}
function fmtDateFull(str) {
  const days = ['日','一','二','三','四','五','六'];
  const dt = new Date(str + 'T00:00:00');
  return `${str} 週${days[dt.getDay()]}`;
}
function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
function num(v){ return parseFloat(v)||0; }
function getRowId(r){ return String(r.id||r['Column 11']||r['欄 11']||r['第 1 欄']||''); }
function getRowName(r){ return String(r.name||r.food||r['食物名稱']||r['名稱']||''); }

// 相容舊版 Apps Script 回傳的中文 key 與日期格式
function parseSheetDate(s) {
  s = String(s||'');
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const mon = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const m = s.match(/(\w{3})\s+(\d{1,2})\s+(\d{4})/);
  if (m && mon[m[1]]) return `${m[3]}-${mon[m[1]]}-${String(m[2]).padStart(2,'0')}`;
  try { const d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10); } catch(e){}
  return s;
}
function parseSheetRow(r) {
  return {
    id:      String(r.id || r['Column 11'] || r['欄 11'] || ''),
    date:    parseSheetDate(r.date || r['日期'] || ''),
    food:    String(r.name || r.food || r['食物名稱'] || ''),
    cal:     num(r.calories ?? r.cal ?? r['熱量']),
    protein: num(r.protein ?? r['蛋白質']),
    carbs:   num(r.carbs ?? r['碳水']),
    fat:     num(r.fat ?? r['油脂']),
    price:   num(r.price ?? r['價錢']),
    emoji:   String(r.emoji || ''),
    photo:   String(r.photo || ''),
    detail:  String(r.detail || '')
  };
}
function rnd(v,d=1){ return parseFloat(v.toFixed(d)); }

function loadAll() {
  try { allData = JSON.parse(localStorage.getItem('dietEntries')||'[]'); } catch(e){ allData=[]; }
  try {
    const ft = JSON.parse(localStorage.getItem('foodTemplates'));
    foodTemplates = ft && ft.length ? ft : DEFAULT_FOOD_TEMPLATES.map(t=>({...t}));
  } catch(e){ foodTemplates = DEFAULT_FOOD_TEMPLATES.map(t=>({...t})); }
  try { goals = {...goals,...JSON.parse(localStorage.getItem('dietGoals')||'{}')}; } catch(e){}
}

// API
// ============================================================
function getSheetUrl(){ return SHEET_API_URL; }

async function apiCall(params) {
  const url = getSheetUrl();
  if(!url) throw new Error('no url');
  const resp = await fetch(url+'?'+new URLSearchParams(params));
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  return resp.json();
}

async function syncAllData() {
  if(!getSheetUrl()){ showToast('尚未設定 API URL','error'); return; }
  showLoading(true);
  try {
    const res = await apiCall({action:'getAll'});
    if(res.status==='ok'){
      const remote = res.rows.map(r=>parseSheetRow(r)).filter(r=>r.id && r.food);
      const byId = {};
      allData.forEach(e=>byId[e.id]=e);
      remote.forEach(e=>{ if(e.food) byId[e.id]={...byId[e.id],...e}; });
      allData = Object.values(byId);
      saveEntries();
      renderDailyTab();
      showToast('已同步','success');
    }
  } catch(e){ showToast('同步失敗，資料已存本地','error'); }
  finally{ showLoading(false); }
}

async function pushEntryToSheet(entry) {
  try {
    await apiCall({action:'add',id:entry.id,date:entry.date,name:entry.food,
      calories:entry.cal,protein:entry.protein,carbs:entry.carbs,
      fat:entry.fat,price:entry.price,detail:entry.detail||''});
    showToast('已同步','success');
  } catch(e){ showToast('同步失敗，資料已存本地','error'); }
}

async function deleteEntryFromSheet(id) {
  try{ await apiCall({action:'delete',id}); }catch(e){}
}

async function syncFoodLibrary() {
  if(!getSheetUrl()){ showToast('尚未設定 API URL','error'); return; }
  showLoading(true);
  try {
    const res = await apiCall({action:'getAllTemplates'});
    if(res.status==='ok'){
      const presetIds = new Set(DEFAULT_FOOD_TEMPLATES.map(t=>t.id));
      const remoteById = {};
      res.rows.forEach(r=>{
        const rid=getRowId(r);
        if(!rid||presetIds.has(rid)||rid.startsWith('config_')) return;
        remoteById[rid]={id:rid,name:getRowName(r),
          calories:num(r.calories||r['熱量']),protein:num(r.protein||r['蛋白質']),
          carbs:num(r.carbs||r['碳水']),fat:num(r.fat||r['油脂']),
          price:num(r.price||r['價錢']),emoji:r.emoji||r['圖示']||'',photo:''};
      });
      const presets = foodTemplates.filter(t=>t.id&&presetIds.has(t.id));
      foodTemplates.filter(t=>t.id&&!presetIds.has(t.id)&&!t.id.startsWith('config_')).forEach(t=>{ remoteById[t.id]={...t,...remoteById[t.id]}; });
      const goalsRows2 = res.rows.filter(r => getRowId(r) === 'config_goals');
      if (goalsRows2.length > 0) {
        try {
          const gName2 = goalsRows2[goalsRows2.length-1].name || goalsRows2[goalsRows2.length-1]['食物名稱'] || '';
          const g2 = JSON.parse(gName2);
          if (g2 && g2.calories) { goals = {...goals,...g2}; saveGoalsLS(); loadSettingsForm(); }
        } catch(e) {}
      }
      foodTemplates = [...presets,...Object.values(remoteById)];
      saveTemplates();
      renderLibraryTab();
      showToast('食物庫已同步','success');
    }
  } catch(e){ showToast('食物庫同步失敗','error'); }
  finally{ showLoading(false); }
}

// ============================================================
// RENDER DAILY
// ============================================================
function renderDailyTab() {
  const dayEntries = allData.filter(e=>e.date===currentDate);
  const totals = calcTotals(dayEntries);
  updateSidebar(totals);
  const list = document.getElementById('entries-list');
  const empty = document.getElementById('empty-state');
  if(dayEntries.length===0){ list.innerHTML=''; empty.style.display='flex'; return; }
  empty.style.display='none';
  list.innerHTML='';
  dayEntries.forEach(entry=>list.appendChild(buildEntryCard(entry)));
}

function calcTotals(entries){
  return entries.reduce((a,e)=>({
    cal:a.cal+num(e.cal), protein:a.protein+num(e.protein),
    carbs:a.carbs+num(e.carbs), fat:a.fat+num(e.fat), price:a.price+num(e.price)
  }),{cal:0,protein:0,carbs:0,fat:0,price:0});
}

function updateSidebar(totals){
  const {cal,protein,carbs,fat,price}=totals;
  document.getElementById('cal-display').textContent = Math.round(cal);
  const remain = goals.calories - cal;
  const remEl = document.getElementById('cal-remain');
  if(remain>=0){ remEl.style.color='var(--accent)'; remEl.textContent=`還可以吃 ${Math.round(remain)} kcal`; }
  else{ remEl.style.color='var(--danger)'; remEl.textContent=`已超標 ${Math.round(-remain)} kcal`; }
  document.getElementById('spending-display').textContent=`今日支出 NT$${Math.round(price)}`;
  const pct = goals.calories>0?clamp(cal/goals.calories,0,1):0;
  const offset = 263.9*(1-pct);
  const fill = document.getElementById('cal-ring-fill');
  fill.setAttribute('stroke-dashoffset',offset);
  const over = cal>goals.calories;
  fill.setAttribute('stroke',over?'var(--danger)':'var(--accent)');
  const pctEl = document.getElementById('cal-pct');
  pctEl.textContent = Math.round(pct*100)+'%';
  pctEl.style.color = over?'var(--danger)':'var(--accent)';
  setMacroBar('protein',protein,goals.protein,'var(--accent3)');
  setMacroBar('carbs',carbs,goals.carbs,'var(--accent2)');
  setMacroBar('fat',fat,goals.fat,'#ff8a80');
}

function setMacroBar(macro,val,goal,color){
  const pct = goal>0?clamp(val/goal*100,0,100):0;
  const over = goal>0 && val>goal*1.1;
  document.getElementById(macro+'-bar').style.width=pct+'%';
  document.getElementById(macro+'-bar').style.background=over?'var(--danger)':color;
  document.getElementById(macro+'-text').textContent=`${rnd(val)}g / ${rnd(goal)}g`;
  document.getElementById(macro+'-text').style.color=over?'var(--danger)':'var(--text)';
  document.getElementById(macro+'-badge').style.display=over?'inline':'none';
}

          <span class="mono" style="font-size:13px;color:var(--accent);font-weight:600;">${Math.round(entry.cal)} kcal</span>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;">

// ============================================================
// LONG PRESS
// ============================================================
function setupLongPress(el, cb){
  let timer=null, fired=false;
  el.addEventListener('pointerdown',()=>{ fired=false; timer=setTimeout(()=>{ fired=true; if(navigator.vibrate)navigator.vibrate(100); cb(); },600); });
  el.addEventListener('pointerup',()=>clearTimeout(timer));
  el.addEventListener('pointercancel',()=>clearTimeout(timer));
  el.addEventListener('click',e=>{ if(fired) e.stopPropagation(); });
}

// DELETE

function confirmDelete(){
  if(!deleteTarget.id) return;
  if(deleteTarget.type==='entry'){
    allData = allData.filter(e=>e.id!==deleteTarget.id);
    saveEntries(); renderDailyTab();
    deleteEntryFromSheet(deleteTarget.id);
  } else if(deleteTarget.type==='template'){
    foodTemplates = foodTemplates.filter(t=>t.id!==deleteTarget.id);
    const presetIds = new Set(DEFAULT_FOOD_TEMPLATES.map(t=>t.id));
    saveTemplates(); renderLibraryTab();
    if(!presetIds.has(deleteTarget.id)) deleteTemplateFromSheet(deleteTarget.id);
  }
  closeModal('delete-confirm-modal');
  deleteTarget={type:null,id:null,name:null};
}

function openRename(entry) {
  renameTarget = entry.id;
  document.getElementById('rename-input').value = entry.food;
  openModal('rename-modal');
}
function confirmRename() {
  const newName = document.getElementById('rename-input').value.trim();
  if (!newName) { showToast('請輸入名稱', 'error'); return; }
  const entry = allData.find(e => e.id === renameTarget);
  if (!entry) return;
  const oldId = entry.id;
  entry.food = newName;
  saveEntries();
  renderDailyTab();
  // Sync: delete old + re-add with new name
  deleteEntryFromSheet(oldId);
  setTimeout(() => pushEntryToSheet(entry), 400);
  closeModal('rename-modal');
  showToast('已重新命名', 'success');
}

function handleNameInput(){
  const q = document.getElementById('add-name').value.trim().toLowerCase();
  const list = document.getElementById('autocomplete-list');
  if(!q){ list.classList.remove('open'); return; }
  const freqMap={};
  allData.forEach(e=>{ freqMap[e.food]=(freqMap[e.food]||0)+1; });
  const seen=new Set(), candidates=[];
  foodTemplates.forEach(t=>{
    if(t.name.toLowerCase().includes(q)&&!seen.has(t.name)){
      seen.add(t.name); candidates.push({name:t.name,freq:freqMap[t.name]||0,template:t});
    }
  });
  allData.forEach(e=>{
    if(e.food.toLowerCase().includes(q)&&!seen.has(e.food)){
      seen.add(e.food); candidates.push({name:e.food,freq:freqMap[e.food]||0,template:null});
    }
  });
  candidates.sort((a,b)=>b.freq-a.freq);
  autocompleteResults = candidates.slice(0,10);
  autocompleteIndex = -1;
  if(!autocompleteResults.length){ list.classList.remove('open'); return; }
  list.innerHTML = autocompleteResults.map((c,i)=>`
    <div class="autocomplete-item" data-idx="${i}">
      <span>${c.name}</span>
      ${c.template?`<span class="mono" style="font-size:11px;color:var(--muted);">${Math.round(c.template.calories)} kcal</span>`:''}
    </div>`).join('');
  list.classList.add('open');
  list.querySelectorAll('.autocomplete-item').forEach(item=>{
    item.addEventListener('click',()=>selectAutocomplete(parseInt(item.dataset.idx)));
  });
}

function handleNameKeydown(e){
  const list = document.getElementById('autocomplete-list');
  if(!list.classList.contains('open')) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); autocompleteIndex=Math.min(autocompleteIndex+1,autocompleteResults.length-1); highlightAC(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); autocompleteIndex=Math.max(autocompleteIndex-1,0); highlightAC(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(autocompleteIndex>=0)selectAutocomplete(autocompleteIndex); }
  else if(e.key==='Escape') list.classList.remove('open');
}
function highlightAC(){
  document.querySelectorAll('.autocomplete-item').forEach((el,i)=>el.classList.toggle('selected',i===autocompleteIndex));
}
function selectAutocomplete(idx){
  const c = autocompleteResults[idx];
  if(!c) return;
  document.getElementById('add-name').value=c.name;
  if(c.template){
    document.getElementById('add-cal').value=c.template.calories;
    document.getElementById('add-protein').value=c.template.protein;
    document.getElementById('add-carbs').value=c.template.carbs;
    document.getElementById('add-fat').value=c.template.fat;
    document.getElementById('add-price').value=c.template.price||'';
    document.getElementById('emojiPicker').value=c.template.emoji||'';
  }
  document.getElementById('autocomplete-list').classList.remove('open');
}

// PHOTO
// ============================================================
function handlePhotoSelect(event, ctx){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=400;
      let w=img.width,h=img.height;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const b64=canvas.toDataURL('image/jpeg',0.8);
      photoBase64[ctx]=b64;
      const pv=document.getElementById(ctx+'-photo-preview');
      const pi=document.getElementById(ctx+'-photo-img');
      if(pi) pi.src=b64;
      if(pv) pv.style.display='block';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function getLast7Days(){
  const d=[]; for(let i=6;i>=0;i--){ const dt=new Date(); dt.setDate(dt.getDate()-i); d.push(localDateStr(dt)); } return d;
}

function getDateRange(range){
  const today=new Date(), dates=[];
  if(range==='month'){
    const y=today.getFullYear(),m=today.getMonth();
    const dim=new Date(y,m+1,0).getDate();
    for(let i=1;i<=dim;i++){ dates.push(localDateStr(new Date(y,m,i))); }
  } else {
    const n=parseInt(range)||7;
    for(let i=n-1;i>=0;i--){ const dt=new Date(); dt.setDate(dt.getDate()-i); dates.push(localDateStr(dt)); }
  }
  return dates;
}

function getDayTotals(date){ return calcTotals(allData.filter(e=>e.date===date)); }

function chartDefaults(){
  return {
    plugins:{ legend:{display:false} },
    scales:{
      x:{ticks:{color:'#7ba3c4',font:{size:11}},grid:{color:'#2d4a6e'}},
      y:{ticks:{color:'#7ba3c4',font:{size:11}},grid:{color:'#2d4a6e'}}
    }
  };
}

function renderWeeklyChart(){
  const days=getLast7Days();
  const totals=days.map(d=>getDayTotals(d));
  const ctx=document.getElementById('weekly-chart');
  if(charts.weekly) charts.weekly.destroy();
  charts.weekly=new Chart(ctx,{
    type:'bar',
    data:{
      labels:days.map(d=>fmtDate(d)),
      datasets:[
        {label:'蛋白質',data:totals.map(t=>Math.round(t.protein*4)),backgroundColor:'rgba(144,224,239,0.85)',stack:'s'},
        {label:'碳水',data:totals.map(t=>Math.round(t.carbs*4)),backgroundColor:'rgba(249,199,79,0.85)',stack:'s'},
        {label:'油脂',data:totals.map(t=>Math.round(t.fat*9)),backgroundColor:'rgba(255,138,128,0.85)',stack:'s'},
      ]
    },
    options:{
      responsive:true,
      scales:{
        x:{stacked:true,ticks:{color:'#7ba3c4',font:{size:11}},grid:{color:'#2d4a6e'}},
        y:{stacked:true,ticks:{color:'#7ba3c4',font:{size:11}},grid:{color:'#2d4a6e'}}
      },
      plugins:{
        legend:{display:true,labels:{color:'#7ba3c4',font:{size:11},boxWidth:12}},

function renderMacroDonut(){

  charts.donut=new Chart(ctx,{
    type:'doughnut',

    options:{responsive:false,cutout:'65%',
      plugins:{legend:{labels:{color:'#7ba3c4',font:{size:12}}},
        tooltip:{callbacks:{label:c=>`${c.label}: ${Math.round(c.parsed/tot*100)}%`}}}}
  });
}

function renderTrendChart(){
  const dates=getDateRange(trendActiveRange);
  const metricColors={cal:'#48cae4',protein:'#90e0ef',carbs:'#f9c74f',fat:'#ff8a80'};
  const metricLabels={cal:'熱量',protein:'蛋白質',carbs:'碳水',fat:'油脂'};
  const datasets=[];
  trendActiveMetrics.forEach(metric=>{
    const data=dates.map(d=>{ const t=getDayTotals(d); return metric==='cal'?Math.round(t.cal):rnd(t[metric]); });
    datasets.push({label:metricLabels[metric],data,borderColor:metricColors[metric],
      backgroundColor:metricColors[metric]+'33',tension:0.3,fill:false,pointRadius:4,pointHoverRadius:6});
  });
  const ctx=document.getElementById('trend-chart');
  if(charts.trend) charts.trend.destroy();
  charts.trend=new Chart(ctx,{
    type:'line',data:{labels:dates.map(d=>fmtDate(d)),datasets},
    options:{responsive:true,
      plugins:{legend:{labels:{color:'#7ba3c4',font:{size:11}}}},
      scales:{
        x:{ticks:{color:'#7ba3c4',font:{size:10},maxRotation:45},grid:{color:'#2d4a6e'}},
        y:{ticks:{color:'#7ba3c4',font:{size:11}},grid:{color:'#2d4a6e'}}
      }}
  });
}

function renderMonthlySpending(){

  closeModal('clear-data-modal');
  document.getElementById('clear-confirm-input').value='';
  checkClearInput();
  renderDailyTab();
  showToast('所有本地資料已清除','info');
}

// ============================================================
// INIT
// ============================================================
async function init(){
  loadAll();
  updateDateDisplay();
  updateSheetStatus();
  renderDailyTab();

  if(SHEET_API_URL !== ''){
    showLoading(true);
    try{
      const res=await apiCall({action:'getAll'});
      if(res.status==='ok'){
        const remote=res.rows.map(r=>parseSheetRow(r)).filter(r=>r.id && r.food);
        // sheet is truth: replace local non-photo fields with sheet data
        const byId={};
        remote.forEach(e=>{ if(e.id) byId[e.id]=e; });
        // keep local photo field if exists
        allData.forEach(e=>{ if(byId[e.id]) byId[e.id].photo=e.photo||''; });
        allData=Object.values(byId);
        saveEntries(); renderDailyTab();
        showToast('已從試算表同步','success');
      }
    }catch(e){ showToast('啟動同步失敗：'+e.message,'error'); }
    try{
      const res2=await apiCall({action:'getAllTemplates'});
      if(res2.status==='ok'){
        const presetIds=new Set(DEFAULT_FOOD_TEMPLATES.map(t=>t.id));
        const remoteById={};
        res2.rows.forEach(r=>{
          const rid=getRowId(r);
          if(!rid||presetIds.has(rid)||rid.startsWith('config_')) return;
          remoteById[rid]={id:rid,name:getRowName(r),
            calories:num(r.calories||r['熱量']),protein:num(r.protein||r['蛋白質']),
            carbs:num(r.carbs||r['碳水']),fat:num(r.fat||r['油脂']),
            price:num(r.price||r['價錢']),emoji:r.emoji||r['圖示']||'',photo:''};
        });
        // Extract goals
        const goalsRows=res2.rows.filter(r=>getRowId(r)==='config_goals');
        if(goalsRows.length>0){
          try{
            const gName=goalsRows[goalsRows.length-1].name||goalsRows[goalsRows.length-1]['食物名稱']||'';
            const g=JSON.parse(gName);
            if(g&&g.calories){goals={...goals,...g};saveGoalsLS();}
          }catch(e){}
        }
        // Merge local user templates
        const presets=foodTemplates.filter(t=>t.id&&presetIds.has(t.id));
        foodTemplates.filter(t=>t.id&&!presetIds.has(t.id)&&!t.id.startsWith('config_')).forEach(t=>{remoteById[t.id]={...t,...remoteById[t.id]};});
        foodTemplates=[...presets,...Object.values(remoteById)];
        saveTemplates();
      }
    }catch(e){}
    showLoading(false);
  }
}

init();
</script>
